name: Release

run-name: Release ${{ github.event.release.tag_name }}

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Skill Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout released version
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release tag
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use SemVer format, e.g. v1.0.0"
            exit 1
          fi

          echo "Release version: ${TAG#v}"

      - name: Validate required files
        shell: bash
        run: |
          test -f SKILL.md || {
            echo "::error::SKILL.md is missing"
            exit 1
          }

          test -f README.md || {
            echo "::error::README.md is missing"
            exit 1
          }

          test -f LICENSE || {
            echo "::error::LICENSE is missing"
            exit 1
          }

      - name: Validate skill discovery
        shell: bash
        run: |
          npx -y skills@latest add . --list